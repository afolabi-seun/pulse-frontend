server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────────────────────────
    # Applied at server scope; no location below sets add_header, so these apply to
    # every response (SPA, proxied API, and SignalR). `always` covers error responses too.
    #
    # CSP connect-src must list every origin the SPA talks to. When the API/SignalR hub are proxied
    # on this same origin (see /api/ and /hubs/), 'self' suffices. The demo deployment serves the SPA
    # cross-origin to the API at pulse-svc.project-demo.app, so that host (https) and its WebSocket
    # (wss) are listed too. Adjust these to match VITE_API_BASE_URL for each environment — ideally
    # template them at deploy time rather than hard-coding.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://pulse-svc.project-demo.app wss://pulse-svc.project-demo.app; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS — honoured by browsers only over HTTPS (TLS terminates at the upstream proxy).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ── API proxy ─────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://pulse-api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── SignalR WebSocket proxy ───────────────────────────────────────────────
    location /hubs/ {
        proxy_pass          http://pulse-api:8080;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade           $http_upgrade;
        proxy_set_header    Connection        "upgrade";
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout  3600s;
    }

    # ── Health endpoints ──────────────────────────────────────────────────────
    location ~ ^/(healthz|readyz|hangfire)(/.*)?$ {
        proxy_pass         http://pulse-api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ── Block dotfiles ────────────────────────────────────────────────────────
    # Defense-in-depth: never serve hidden files (.env, .git, etc.) even if one
    # ends up in the web root. The build only emits index.html + assets, so this
    # should never match in practice — it's a safety net.
    location ~ /\. {
        deny all;
        return 404;
    }

    # ── Sourcemaps ────────────────────────────────────────────────────────────
    # Production builds emit no readable .map files (see vite.config.ts). This
    # blocks access to any that might slip in (e.g. a misconfigured build).
    location ~* \.map$ {
        deny all;
        return 404;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/wasm;
}
